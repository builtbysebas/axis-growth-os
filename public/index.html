<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Axis Growth OS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f4f1">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/os.css">
  <link rel="stylesheet" href="/css/lite.css">
  <link rel="stylesheet" href="/css/ventas.css">
  <link rel="stylesheet" href="/css/clientes.css">
  <link rel="stylesheet" href="/css/contenido.css">
  <link rel="stylesheet" href="/css/resultados.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/equipo.css">
  <script>
    // Color del negocio guardado en este navegador (ver js/core/theme.js): evita ver el naranja un instante.
    try {
      var v = JSON.parse(localStorage.getItem('ago-theme') || 'null');
      if (v) for (var k in v) if (/^--accent/.test(k)) document.documentElement.style.setProperty(k, v[k]);
      if (v && /^data:image\/svg\+xml,/.test(v.icon || '')) document.querySelector('link[rel~="icon"]').href = v.icon;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="polite"><p class="lite-loading"><span class="lite-spinner"></span>Cargando…</p></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
